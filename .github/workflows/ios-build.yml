
name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Sign iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable

      - name: Install Signing Files
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$CERT_BASE64" || {
            echo "Missing IOS_CERTIFICATE_BASE64"
            exit 1
          }
          test -n "$CERT_PASSWORD" || {
            echo "Missing IOS_CERTIFICATE_PASSWORD"
            exit 1
          }
          test -n "$PROFILE_BASE64" || {
            echo "Missing IOS_PROVISION_PROFILE_BASE64"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/signing"
          echo "$CERT_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/signing/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/signing/profile.mobileprovision"

          security create-keychain \
            -p "$CERT_PASSWORD" "$RUNNER_TEMP/signing/build.keychain"
          security unlock-keychain \
            -p "$CERT_PASSWORD" "$RUNNER_TEMP/signing/build.keychain"
          security import "$RUNNER_TEMP/signing/certificate.p12" \
            -k "$RUNNER_TEMP/signing/build.keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$CERT_PASSWORD" "$RUNNER_TEMP/signing/build.keychain"

          security default-keychain -s "$RUNNER_TEMP/signing/build.keychain"

          security cms -D \
            -i "$RUNNER_TEMP/signing/profile.mobileprovision" \
            > "$RUNNER_TEMP/signing/profile.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :Name' "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy \
            -c 'Print :ExpirationDate' "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$RUNNER_TEMP/signing/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' "$RUNNER_TEMP/signing/profile.plist")
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          security find-identity -v -p codesigning \
            "$RUNNER_TEMP/signing/build.keychain"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Archive
        run: |
          flutter build ios --release

      - name: Export Signed IPA
        env:
          PROFILE_PATH: ${{ runner.temp }}/signing/profile.plist
          PROFILE_FILE: ${{ runner.temp }}/signing/profile.mobileprovision
        run: |
          set -euo pipefail

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            build/ios/iphoneos/Runner.app/Info.plist)

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$PROFILE_PATH")
          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' "$PROFILE_PATH")

          case "$PROFILE_APP_ID" in
            *".$BUNDLE_ID") ;;
            *)
              echo "Provisioning profile does not match bundle ID: $BUNDLE_ID"
              exit 1
              ;;
          esac

          cp "$PROFILE_FILE" \
            build/ios/iphoneos/Runner.app/embedded.mobileprovision

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleSupportedPlatforms:0 iPhoneOS" \
            build/ios/iphoneos/Runner.app/Info.plist

          codesign --force --sign "$(
            security find-identity -v -p codesigning \
              "$RUNNER_TEMP/signing/build.keychain" |
              sed -n 's/.*"\(Apple Distribution:.*\)".*/\1/p' |
              head -n 1
          )" --entitlements "$RUNNER_TEMP/signing/profile.plist" \
            build/ios/iphoneos/Runner.app

          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry Simple.Music.Player.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Music-Player-IPA
          path: Simple.Music.Player.ipa
          retention-days: 30
